<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — FitConstructor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
        }
        .profile-info {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-right: 10px;
        }
        .btn-logout {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <h1>👤 Мой профиль</h1>
            
            <div class="profile-info">
                <p><strong>Имя пользователя:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Дата регистрации:</strong> {{ user.created_at.strftime('%d.%m.%Y') if user.created_at else 'Не указана' }}</p>
            </div>
            
            <a href="{{ url_for('constructor') }}" class="btn">🏋️ Перейти в конструктор</a>
            <a href="{{ url_for('logout') }}" class="btn btn-logout">🚪 Выйти из аккаунта</a>
        </div>
    </div>
</body>
</html>
